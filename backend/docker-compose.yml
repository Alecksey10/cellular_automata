services:
  db:
    image: postgres:18
    container_name: cellular_automata_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - my-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cellular_automata_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "${PGADMIN_PORT}:80"

    depends_on:
      - db

    volumes:
      - pgadmin_data:/var/lib/pgadmin
    
    networks:
      - my-network
      

volumes:
  postgres_data:
  pgadmin_data:

networks:
  my-network:
    driver: bridge